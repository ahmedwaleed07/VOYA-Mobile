name: VOYA Android Play Bundle Preparation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/android-play-prep.yml'

permissions:
  contents: read

jobs:
  build-play-bundle:
    runs-on: ubuntu-latest
    env:
      VOYA_UPLOAD_STORE_PASSWORD: ${{ secrets.VOYA_UPLOAD_STORE_PASSWORD }}
      VOYA_UPLOAD_KEY_ALIAS: ${{ secrets.VOYA_UPLOAD_KEY_ALIAS }}
      VOYA_UPLOAD_KEY_PASSWORD: ${{ secrets.VOYA_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 and build tools
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -n "$SDK_MANAGER" || { echo "Android SDK command line tools missing"; exit 1; }
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure optional secure upload signing
        env:
          UPLOAD_KEY_B64: ${{ secrets.VOYA_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [[ -z "$UPLOAD_KEY_B64" && -z "$VOYA_UPLOAD_STORE_PASSWORD" && -z "$VOYA_UPLOAD_KEY_ALIAS" && -z "$VOYA_UPLOAD_KEY_PASSWORD" ]]; then
            echo "VOYA_SIGNED_BUNDLE=false" >> "$GITHUB_ENV"
            echo "No upload key supplied: building an unsigned AAB for review only."
          else
            if [[ -z "$UPLOAD_KEY_B64" || -z "$VOYA_UPLOAD_STORE_PASSWORD" || -z "$VOYA_UPLOAD_KEY_ALIAS" || -z "$VOYA_UPLOAD_KEY_PASSWORD" ]]; then
              echo "Signing secrets are incomplete; refusing to build a misleading release." >&2
              exit 1
            fi
            SIGNING_FILE="$RUNNER_TEMP/voya-upload.jks"
            printf '%s' "$UPLOAD_KEY_B64" | base64 --decode > "$SIGNING_FILE"
            chmod 600 "$SIGNING_FILE"
            echo "VOYA_UPLOAD_KEYSTORE_FILE=$SIGNING_FILE" >> "$GITHUB_ENV"
            echo "VOYA_SIGNED_BUNDLE=true" >> "$GITHUB_ENV"
          fi

      - name: Build Play AAB
        working-directory: Android
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed bundle
        if: env.VOYA_SIGNED_BUNDLE == 'true'
        run: jarsigner -verify -certs Android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish signed AAB artifact
        if: env.VOYA_SIGNED_BUNDLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VOYA-Android-Play-SIGNED-AAB
          path: Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish unsigned AAB for review only
        if: env.VOYA_SIGNED_BUNDLE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VOYA-Android-UNSIGNED-AAB-NOT-FOR-UPLOAD
          path: Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
