name: VOYA Mobile Development Builds
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Android and iOS source structure
        run: python3 scripts/verify_source.py

  android-debug:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include Android SDK command-line tools.
      - name: Install Android API 36 and build tools
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -n "$SDK_MANAGER" || { echo "Android SDK cmdline-tools missing"; exit 1; }
          "$SDK_MANAGER" --version
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile installable Android debug APK
        working-directory: Android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VOYA-Android-Debug-APK
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode version and syntax
        run: |
          xcodebuild -version
          swiftc -frontend -parse iOS/VOYA/VOYAApp.swift iOS/VOYA/VOYABrowserScreen.swift
      - name: Compile unsigned iOS Simulator app
        run: |
          xcodebuild -project iOS/VOYA.xcodeproj -scheme VOYA \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/VOYA-iOS-Simulator.app.zip" VOYA.app
      - uses: actions/upload-artifact@v4
        with:
          name: VOYA-iOS-Simulator-App
          path: VOYA-iOS-Simulator.app.zip
          if-no-files-found: error
